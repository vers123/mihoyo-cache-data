name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package scripts
        run: |
          mkdir -p release-pkg
          cp -r scripts release-pkg/
          cp requirements.txt README.md LICENSE release-pkg/
          cd release-pkg
          zip -r ../mihoyo-cache-data.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: mihoyo-cache-data.zip
          generate_release_notes: true
