name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Cache_Sorted
        run: |
          cd Cache_Sorted
          zip -r ../Cache_Sorted.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Cache_Sorted.zip
          generate_release_notes: true
